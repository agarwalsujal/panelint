<!--
  A chart component reading its configuration out of a data-* attribute. The
  value parses as JSON, which is what marks it as configuration rather than
  attribute-borne prose -- PANE-HIDDEN-015 must exclude it outright.
-->
<div
  class="chart"
  data-values='{"labels":["Q1","Q2","Q3","Q4"],"series":[120,145,168,190],"colors":["#4c72b0","#dd8452","#55a868","#c44e52"]}'
></div>
