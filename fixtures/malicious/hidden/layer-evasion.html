<!--
  @layer opacity evasion. A resolver that only reads the CASCADE WINNER sees
  opacity:1 here (layer b outranks layer a) and reports nothing, while a
  browser renders this text at opacity:0. candidatesFor is additive, so the
  LOSING declaration in layer b still counts as a carrier.
-->
<style>
  @layer a, b;
  @layer b { .x { opacity: 0 } }
  @layer a { .x { opacity: 1 } }
</style>
