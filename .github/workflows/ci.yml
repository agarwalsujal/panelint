# Panelint's own CI.
#
# The `gate` job is split out from `test` deliberately. Both run inside
# `npm test`, so splitting them buys no coverage — it buys a named, separately
# required check. The reference-corpus gate and the never-fire guards are the
# reason anyone should trust a finding from this tool, and a reviewer looking at
# a PR should be able to see that they passed without opening a log.
#
# See CONTRIBUTING.md, which documents these as the two commands a contributor
# runs before opening a PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A scanner has no business writing to the repository it is built in.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite cannot run on the declared engines floor: vitest's rolldown
        # dependency imports `styleText` from node:util, which landed in 20.12.
        # That is a devDependency constraint, not a constraint on the shipped
        # CLI — so the floor is proven by the `engines-floor` job below, which
        # runs the packed artifact rather than the suite. Do not "fix" this by
        # raising engines; that would overstate what the published package
        # needs.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Never `npm install` in CI — the lockfile is the control. Dependencies
      # are exact-pinned, and `ci` is what enforces that at install time.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  gate:
    name: false-positive gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A finding on conformant code is the highest-severity bug this project
      # has. These two commands are what make that claim checkable.
      - name: Reference corpus — no rule may gate on a conformant server
        run: npm run test:corpus

      - name: Never-fire guards — the spec-mandated patterns
        run: npm run test:never-fire

  pack:
    name: published artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Packs, installs into an empty directory, and runs the CLI from there.
      # `npm test` proves the source works; only this proves the tarball does.
      - run: npm run test:pack

  engines-floor:
    name: runs on the declared engines floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build on a modern Node — the toolchain's requirements are not the
      # published package's requirements.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - name: Pack the artifact
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # Then drop to the exact floor in package.json engines and run what a
      # user would actually install. This is the job that makes ">=20.10.0" a
      # tested claim instead of an assumption. Pin the patch: "20.x" would
      # drift upward and quietly stop testing the floor.
      - uses: actions/setup-node@v5
        with:
          node-version: '20.10.0'

      - name: Install and run the published CLI on Node 20.10.0
        run: |
          set -euo pipefail
          node --version
          mkdir -p "$RUNNER_TEMP/floor"
          cd "$RUNNER_TEMP/floor"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/panelint-*.tgz
          ./node_modules/.bin/panelint --version
          ./node_modules/.bin/panelint rules --json > /dev/null
          # Capture replay is the path that reads schema/schema.json off disk.
          cp "$GITHUB_WORKSPACE/fixtures/capture/valid.json" ./capture.json
          ./node_modules/.bin/panelint scan ./capture.json --no-color --fail-on critical
          ./node_modules/.bin/panelint scan "$GITHUB_WORKSPACE/fixtures/dirscan/basic" --no-color
